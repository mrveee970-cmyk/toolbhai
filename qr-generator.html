<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToolBhai - QR Generator</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body{
background:#0f172a;
font-family:Arial, sans-serif;
color:white;
}
</style>
</head>

<body class="min-h-screen">

<header class="p-4 border-b border-gray-700 flex justify-between items-center">
<h1 class="text-2xl font-bold text-blue-400">ToolBhai</h1>

<a href="index.html" class="bg-blue-600 px-4 py-2 rounded-lg">
Home
</a>
</header>

<div class="max-w-md mx-auto p-4">

<h2 class="text-3xl font-bold mt-6 mb-2">
QR Code Generator
</h2>

<p class="text-gray-400 mb-6">
Generate QR codes instantly.
</p>

<div class="bg-slate-800 p-4 rounded-2xl">

<input
id="qrText"
type="text"
placeholder="Enter text or URL"
class="w-full p-3 rounded-lg bg-slate-900 border border-gray-700 outline-none mb-4"
/>

<button
onclick="generateQR()"
class="w-full bg-blue-600 hover:bg-blue-700 p-3 rounded-xl font-bold"
>
Generate QR Code
</button>

<div
id="qrcode"
class="bg-white p-4 mt-6 rounded-xl flex justify-center"
></div>

<button
id="downloadBtn"
onclick="downloadQR()"
class="hidden mt-4 w-full bg-green-600 hover:bg-green-700 p-3 rounded-xl font-bold"
>
Download QR
</button>

</div>

</div>

<script>

let qr;

function generateQR(){

const text = document.getElementById("qrText").value;

if(text.trim() === ""){
alert("Please enter text");
return;
}

document.getElementById("qrcode").innerHTML = "";

qr = new QRCode(document.getElementById("qrcode"),{
text:text,
width:220,
height:220
});

document.getElementById("downloadBtn").classList.remove("hidden");

}

function downloadQR(){

const img = document.querySelector("#qrcode img");

if(img){

const link = document.createElement("a");

link.href = img.src;

link.download = "toolbhai-qr.png";

link.click();

}

}

</script>

</body>
</html>
