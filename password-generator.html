<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToolBhai - Password Generator</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">

<style>
body{
font-family:Arial,sans-serif;
background:#0f172a;
color:white;
}
</style>

</head>

<body class="min-h-screen">

<header class="bg-[#111827] border-b border-gray-700 px-4 py-4 flex justify-between items-center">
<h1 class="text-2xl font-bold text-blue-500">ToolBhai</h1>

<a href="index.html" class="bg-blue-600 px-4 py-2 rounded-xl text-sm">
Home
</a>
</header>

<div class="max-w-md mx-auto p-4">

<div class="bg-[#1e293b] rounded-3xl p-6 mt-6 shadow-lg">

<h2 class="text-2xl font-bold mb-4">
Password Generator
</h2>

<div class="bg-[#0f172a] p-4 rounded-2xl mb-4 break-all">
<p id="passwordOutput" class="text-blue-400 text-xl">
Click Generate
</p>
</div>

<div class="mb-5">
<label class="block mb-2">
Password Length:
<span id="lengthValue">12</span>
</label>

<input 
type="range" 
min="4" 
max="32" 
value="12"
id="lengthSlider"
class="w-full">
</div>

<div class="space-y-3 mb-6">

<label class="flex items-center gap-3">
<input type="checkbox" id="uppercase" checked>
<span>Uppercase Letters</span>
</label>

<label class="flex items-center gap-3">
<input type="checkbox" id="lowercase" checked>
<span>Lowercase Letters</span>
</label>

<label class="flex items-center gap-3">
<input type="checkbox" id="numbers" checked>
<span>Numbers</span>
</label>

<label class="flex items-center gap-3">
<input type="checkbox" id="symbols" checked>
<span>Symbols</span>
</label>

</div>

<button 
onclick="generatePassword()"
class="w-full bg-blue-600 hover:bg-blue-700 transition py-4 rounded-2xl text-lg font-bold">

Generate Password

</button>

<button 
onclick="copyPassword()"
class="w-full bg-green-600 hover:bg-green-700 transition py-4 rounded-2xl text-lg font-bold mt-4">

Copy Password

</button>

</div>

<div class="mt-8 bg-[#1e293b] p-5 rounded-2xl text-center text-gray-400">
Adsterra Ad Space
</div>

</div>

<script>

const slider = document.getElementById("lengthSlider");
const lengthValue = document.getElementById("lengthValue");

slider.addEventListener("input", () => {
lengthValue.innerText = slider.value;
});

function generatePassword(){

const upper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const lower = "abcdefghijklmnopqrstuvwxyz";
const numbers = "0123456789";
const symbols = "!@#$%^&*()_+";

let chars = "";

if(document.getElementById("uppercase").checked){
chars += upper;
}

if(document.getElementById("lowercase").checked){
chars += lower;
}

if(document.getElementById("numbers").checked){
chars += numbers;
}

if(document.getElementById("symbols").checked){
chars += symbols;
}

if(chars === ""){
alert("Select at least one option");
return;
}

let password = "";

for(let i=0;i<slider.value;i++){
password += chars.charAt(
Math.floor(Math.random() * chars.length)
);
}

document.getElementById("passwordOutput").innerText = password;

}

function copyPassword(){

const text =
document.getElementById("passwordOutput").innerText;

navigator.clipboard.writeText(text);

alert("Password Copied!");

}

</script>

</body>
  </html>
