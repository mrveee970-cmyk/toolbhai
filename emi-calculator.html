<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ToolBhai - EMI Calculator</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
background:#0f172a;
font-family:Arial,sans-serif;
color:white;
}
</style>

</head>

<body class="min-h-screen">

<header class="p-4 border-b border-gray-700 flex justify-between items-center">

<h1 class="text-2xl font-bold text-green-400">
ToolBhai
</h1>

<a href="index.html" class="bg-green-600 px-4 py-2 rounded-lg">
Home
</a>

</header>

<div class="max-w-md mx-auto p-4">

<h2 class="text-3xl font-bold mt-6 mb-2">
EMI Calculator
</h2>

<p class="text-gray-400 mb-6">
Calculate monthly loan EMI instantly.
</p>

<div class="bg-slate-800 p-5 rounded-2xl">

<label class="block mb-2">
Loan Amount
</label>

<input
type="number"
id="loanAmount"
placeholder="Enter amount"
class="w-full p-3 rounded-lg bg-slate-900 border border-gray-700 outline-none mb-4"
/>

<label class="block mb-2">
Interest Rate (% yearly)
</label>

<input
type="number"
id="interestRate"
placeholder="Enter interest"
class="w-full p-3 rounded-lg bg-slate-900 border border-gray-700 outline-none mb-4"
/>

<label class="block mb-2">
Loan Tenure (Years)
</label>

<input
type="number"
id="loanTenure"
placeholder="Enter years"
class="w-full p-3 rounded-lg bg-slate-900 border border-gray-700 outline-none mb-5"
/>

<button
onclick="calculateEMI()"
class="w-full bg-green-600 hover:bg-green-700 p-3 rounded-xl font-bold"
>
Calculate EMI
</button>

<div
id="resultBox"
class="hidden mt-6 bg-slate-900 p-5 rounded-2xl"
>

<h3 class="text-xl font-bold mb-4 text-green-400">
Loan Summary
</h3>

<p class="mb-3">
Monthly EMI:
<span id="emiResult" class="font-bold"></span>
</p>

<p class="mb-3">
Total Interest:
<span id="interestResult" class="font-bold"></span>
</p>

<p class="mb-3">
Total Payment:
<span id="paymentResult" class="font-bold"></span>
</p>

<button
onclick="downloadResult()"
class="mt-4 w-full bg-blue-600 hover:bg-blue-700 p-3 rounded-xl font-bold"
>
Download Result
</button>

</div>

</div>

<div class="bg-slate-800 mt-6 p-5 rounded-2xl text-center text-gray-400">
Adsterra Ad Space
</div>

</div>

<script>

function calculateEMI(){

const P =
parseFloat(
document.getElementById("loanAmount").value
);

const annualRate =
parseFloat(
document.getElementById("interestRate").value
);

const years =
parseFloat(
document.getElementById("loanTenure").value
);

if(!P || !annualRate || !years){

alert("Please fill all fields");

return;

}

const r =
annualRate / 12 / 100;

const n =
years * 12;

const emi =
(P * r * Math.pow(1+r,n)) /
(Math.pow(1+r,n)-1);

const totalPayment =
emi * n;

const totalInterest =
totalPayment - P;

document.getElementById("resultBox")
.classList.remove("hidden");

document.getElementById("emiResult")
.innerText = "₹ " + emi.toFixed(2);

document.getElementById("interestResult")
.innerText = "₹ " + totalInterest.toFixed(2);

document.getElementById("paymentResult")
.innerText = "₹ " + totalPayment.toFixed(2);

}

function downloadResult(){

const emi =
document.getElementById("emiResult").innerText;

const interest =
document.getElementById("interestResult").innerText;

const payment =
document.getElementById("paymentResult").innerText;

const text =
`EMI RESULT

Monthly EMI: ${emi}

Total Interest: ${interest}

Total Payment: ${payment}`;

const blob =
new Blob([text],{type:"text/plain"});

const link =
document.createElement("a");

link.href =
URL.createObjectURL(blob);

link.download =
"emi-result.txt";

link.click();

}

</script>

</body>
</html>
